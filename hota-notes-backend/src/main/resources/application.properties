spring.application.name=HotaNotes

# ============== DEV (default) ==============
# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:hotanotes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate (H2 dialect)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations disabled in dev
spring.flyway.enabled=false

# H2 web console (for browsing your dev data at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


